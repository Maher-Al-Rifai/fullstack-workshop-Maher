name: Starter continuous integration

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: starter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Starter backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install and validate
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest

  frontend:
    name: Starter frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install, typecheck, and build
        working-directory: frontend
        run: |
          npm install
          npm run typecheck
          npm run build

  containers:
    name: Starter production images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker build --target production --tag workboard-starter-api ./backend
          docker build --target production --tag workboard-starter-web ./frontend
