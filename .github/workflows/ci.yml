name: Continuous integration

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions for all jobs. id-token: write is granted only in the
# separate deploy workflow so PR builds cannot request cloud credentials.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workboard_ci
          POSTGRES_USER: workboard
          POSTGRES_PASSWORD: ci-password
        options: >-
          --health-cmd "pg_isready -U workboard -d workboard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      # Test secrets stay here, never in repository/organization secrets.
      DATABASE_URL: postgresql+psycopg://workboard:ci-password@localhost:5432/workboard_ci
      SECRET_KEY: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Ruff — lint
        working-directory: backend
        run: ruff check .
      - name: Ruff — format
        working-directory: backend
        run: ruff format --check .
      - name: Mypy — type check
        working-directory: backend
        run: mypy app
      - name: Verify schema against PostgreSQL
        working-directory: backend
        run: alembic upgrade head
      - name: Pytest — with coverage
        working-directory: backend
        # TestClient fixtures override get_db with SQLite for speed; this is intentional.
        # PostgreSQL compatibility is validated by the schema step above.
        run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        # Switch to `npm ci` once package-lock.json is committed to the repository.
        run: npm install --legacy-peer-deps
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript — type check
        working-directory: frontend
        run: npm run typecheck
      - name: Vitest — unit and component tests
        working-directory: frontend
        run: npm test
      - name: Nuxt — production build
        working-directory: frontend
        run: npm run build

  containers:
    name: Production image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build backend production image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false
          tags: workboard-api:ci
          # Scoped GHA cache avoids cross-job cache collisions.
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,scope=backend-prod,mode=max
      - name: Build frontend production image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: false
          tags: workboard-web:ci
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,scope=frontend-prod,mode=max

  e2e:
    name: E2E acceptance tests
    runs-on: ubuntu-latest
    needs: [containers]
    steps:
      - uses: actions/checkout@v7
      - name: Build acceptance stack
        run: docker compose -f compose.test.yaml build
      - name: Run Playwright tests
        # Preserve the exit code; subsequent steps use `if: always()` to ensure cleanup.
        run: docker compose -f compose.test.yaml run --rm playwright
      - name: Extract Playwright artifacts from named volume
        if: always()
        run: |
          mkdir -p playwright-artifacts
          docker run --rm \
            -v fullstack-intern-starter-test_playwright-artifacts:/src:ro \
            -v "$(pwd)/playwright-artifacts":/dst \
            alpine sh -c "cp -r /src/. /dst/ 2>/dev/null || true"
      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f compose.test.yaml logs --no-color
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down acceptance stack
        if: always()
        run: docker compose -f compose.test.yaml down -v --remove-orphans
